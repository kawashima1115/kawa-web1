<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アカウント削除 - kawa-web</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f5f5f5;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: 0 auto;
    padding: 30px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px solid #e1e5e9;
}

.header h1 {
    font-size: 28px;
    color: #dc3545;
}

.btn {
    display: inline-block;
    padding: 10px 20px;
    background: #2e7d32;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
    transition: background 0.3s;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
}

.btn:hover {
    background: #1b5e20;
}

.btn-secondary {
    background: #6c757d;
}

.btn-secondary:hover {
    background: #5a6268;
}

.btn-danger {
    background: #dc3545;
}

.btn-danger:hover {
    background: #c82333;
}

.alert {
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 6px;
}

.alert-error {
    background: rgba(220, 53, 69, 0.1);
    color: #721c24;
    border-left: 4px solid #dc3545;
}

.warning-box {
    background: rgba(220, 53, 69, 0.05);
    border: 2px solid #dc3545;
    padding: 25px;
    border-radius: 8px;
    margin-bottom: 30px;
}

.warning-box h2 {
    color: #dc3545;
    font-size: 20px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
}

.warning-box h2::before {
    content: "⚠";
    font-size: 24px;
    margin-right: 10px;
}

.warning-box ul {
    margin: 15px 0 15px 20px;
    color: #495057;
}

.warning-box ul li {
    margin-bottom: 8px;
}

.warning-box p {
    color: #495057;
    line-height: 1.6;
}

.warning-box strong {
    color: #dc3545;
}

.form-group {
    margin-bottom: 25px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: #495057;
    font-weight: 600;
    font-size: 14px;
}

.form-group input {
    width: 100%;
    padding: 12px;
    border: 2px solid #dc3545;
    border-radius: 6px;
    font-size: 14px;
    transition: border-color 0.3s, box-shadow 0.3s;
}

.form-group input:focus {
    outline: none;
    border-color: #c82333;
    box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.1);
}

.form-help {
    font-size: 12px;
    color: #6c757d;
    margin-top: 5px;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.form-actions button,
.form-actions a {
    flex: 1;
    text-align: center;
}

.user-info {
    background: #f8f9fa;
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 25px;
}

.user-info h3 {
    color: #495057;
    font-size: 16px;
    margin-bottom: 10px;
}

.user-info p {
    color: #6c757d;
    margin: 5px 0;
    font-size: 14px;
}
</style>
</head>
<body>
<div class="container">
    <!-- ヘッダー -->
    <div class="header">
        <h1>アカウント削除</h1>
        <a href="/mypage" class="btn btn-secondary">戻る</a>
    </div>

    <!-- エラーメッセージ -->
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <!-- ユーザー情報 -->
    <div class="user-info">
        <h3>削除対象アカウント</h3>
        <p><strong>ユーザー名:</strong> <span th:text="${loggedInUser.username}">username</span></p>
        <p th:if="${loggedInUser.email != null and !loggedInUser.email.isEmpty()}">
            <strong>メールアドレス:</strong> <span th:text="${loggedInUser.email}">email@example.com</span>
        </p>
    </div>

    <!-- 警告ボックス -->
    <div class="warning-box">
        <h2>本当にアカウントを削除しますか?</h2>
        <p>この操作は取り消すことができません。アカウントを削除すると、以下のデータがすべて失われます:</p>
        <ul>
            <li>あなたのプロフィール情報</li>
            <li>これまでに投稿したすべての内容</li>
            <li>その他すべてのアカウント関連データ</li>
        </ul>
        <p><strong>削除を実行するには、パスワードを入力してください。</strong></p>
    </div>

    <!-- 削除フォーム -->
    <form action="/mypage/delete" method="post" onsubmit="return confirmDelete();">
        <div class="form-group">
            <label for="password">パスワード</label>
            <input type="password" id="password" name="password" 
                   placeholder="パスワードを入力してください" required>
            <div class="form-help">本人確認のため、現在のパスワードを入力してください</div>
        </div>

        <div class="form-actions">
            <a href="/mypage" class="btn btn-secondary">キャンセル</a>
            <button type="submit" class="btn btn-danger">アカウントを削除する</button>
        </div>
    </form>
</div>

<script>
function confirmDelete() {
    return confirm('本当にアカウントを削除してもよろしいですか?\n\nこの操作は取り消せません。');
}
</script>
</body>
</html>
