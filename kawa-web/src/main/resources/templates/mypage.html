<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マイページ - kawa-web</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f5f5f5;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 30px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px solid #e1e5e9;
}

.header h1 {
    font-size: 28px;
    color: #2e7d32;
}

.btn {
    display: inline-block;
    padding: 10px 20px;
    background: #2e7d32;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
    transition: background 0.3s;
}

.btn:hover {
    background: #1b5e20;
}

.btn-danger {
    background: #dc3545;
}

.btn-danger:hover {
    background: #c82333;
}

.header .btn {
    margin-left: 10px;
}

.header form {
    display: inline;
}

.header button.btn {
    border: none;
    cursor: pointer;
    font-family: inherit;
}

.alert {
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 6px;
}

.alert-success {
    background: rgba(40, 167, 69, 0.1);
    color: #155724;
    border-left: 4px solid #28a745;
}

.alert-error {
    background: rgba(220, 53, 69, 0.1);
    color: #721c24;
    border-left: 4px solid #dc3545;
}

.alert-info {
    background: rgba(13, 202, 240, 0.1);
    color: #055160;
    border-left: 4px solid #0dcaf0;
}

.profile-card {
    background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
    color: white;
    padding: 40px;
    border-radius: 12px;
    margin-bottom: 30px;
}

.profile-card h2 {
    font-size: 32px;
    margin-bottom: 10px;
}

.profile-card p {
    margin: 5px 0;
    opacity: 0.9;
}

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.2);
}

.stat-item {
    text-align: center;
    transition: all 0.3s ease;
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
}

.stat-item:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(1.05);
}

.stat-item.active {
    background: rgba(255, 255, 255, 0.3);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

.stat-value {
    font-size: 36px;
    font-weight: 700;
}

.stat-label {
    font-size: 13px;
    opacity: 0.8;
    margin-top: 5px;
}

.actions {
    margin-bottom: 30px;
    text-align: center;
}

.actions .btn {
    margin: 0 5px;
}

.section-title {
    color: #495057;
    margin-bottom: 20px;
    font-size: 20px;
    font-weight: 600;
}

.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #6c757d;
    background: rgba(46, 125, 50, 0.05);
    border-radius: 8px;
}

.empty-state p {
    margin: 10px 0;
}

.empty-state a {
    color: #2e7d32;
    text-decoration: none;
    font-weight: 600;
}

.post {
    background: white;
    border: 1px solid #e9ecef;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
    transition: box-shadow 0.3s;
}

.post:hover {
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

.post-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    font-size: 14px;
    color: #6c757d;
}

.post-content {
    color: #212529;
    line-height: 1.6;
}

.delete-btn {
    background: rgba(220, 53, 69, 0.1);
    border: none;
    color: #dc3545;
    cursor: pointer;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 12px;
    transition: background 0.3s;
}

.delete-btn:hover {
    background: rgba(220, 53, 69, 0.2);
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>マイページ</h1>
        <div>
            <a href="/" class="btn">トップページ</a>
            <form action="/logout" method="post" style="display: inline;">
                <button type="submit" class="btn btn-danger">ログアウト</button>
            </form>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${info}" class="alert alert-info" th:text="${info}"></div>

    <div class="profile-card">
        <h2 th:text="${user.username}">ユーザー名</h2>
        <p th:if="${user.email != null and !user.email.isEmpty()}">
             <span th:text="${user.email}">email@example.com</span>
        </p>
        <p>登録日: <span th:text="${#temporals.format(user.createdAt, 'yyyy年MM月dd日')}">2024年01月01日</span></p>
        
        <div class="stats">
            <div class="stat-item active" id="posts-stat" onclick="showTab('posts')">
                <div class="stat-value" th:text="${postCount}">0</div>
                <div class="stat-label">投稿数</div>
            </div>
            <div class="stat-item" id="replies-stat" onclick="showTab('replies')">
                <div class="stat-value" th:text="${replyCount}">0</div>
                <div class="stat-label">返信数</div>
            </div>
        </div>
    </div>

    <div class="actions">
        <a href="/mypage/edit" class="btn">プロフィール編集</a>
        <a href="/mypage/delete-confirm" class="btn btn-danger">アカウント削除</a>
    </div>

    <!-- 投稿タブ -->
    <div id="posts-tab" class="tab-content active">
        <h2 class="section-title">あなたの投稿</h2>

        <div th:if="${userPosts.isEmpty()}" class="empty-state">
            <p>まだ投稿がありません</p>
            <p><a href="/">トップページ</a>から投稿してみましょう!</p>
        </div>

        <div th:unless="${userPosts.isEmpty()}">
            <div th:each="post : ${userPosts}" class="post">
                <div class="post-header">
                    <span th:text="${#temporals.format(post.createdAt, 'yyyy/MM/dd HH:mm')}">2024/01/01 12:00</span>
                    
                    <form action="/post/delete" method="post" style="display: inline;" 
                          onsubmit="return confirm('本当に削除しますか?');">
                        <input type="hidden" name="postId" th:value="${post.id}">
                        <button type="submit" class="delete-btn">削除</button>
                    </form>
                </div>
                
                <div class="post-content" th:utext="${post.content}">投稿内容</div>
            </div>
        </div>
    </div>

    <!-- 返信タブ -->
    <div id="replies-tab" class="tab-content">
        <h2 class="section-title">あなたの返信</h2>

        <div th:if="${userReplies == null or userReplies.isEmpty()}" class="empty-state">
            <p>まだ返信がありません</p>
        </div>

        <div th:if="${userReplies != null and !userReplies.isEmpty()}">
            <div th:each="reply : ${userReplies}" class="post">
                <div class="post-header">
                    <div>
                        <span th:text="${#temporals.format(reply.createdAt, 'yyyy/MM/dd HH:mm')}">2024/01/01 12:00</span>
                        <span style="color: #6c757d; font-size: 12px; margin-left: 10px;" th:if="${reply.parent != null}">
                            → <strong th:text="${reply.parent.username}">ユーザー名</strong>への返信
                        </span>
                    </div>
                    
                    <form action="/post/delete" method="post" style="display: inline;" 
                          onsubmit="return confirm('本当に削除しますか?');">
                        <input type="hidden" name="postId" th:value="${reply.id}">
                        <button type="submit" class="delete-btn">削除</button>
                    </form>
                </div>
                
                <div class="post-content" th:utext="${reply.content}">返信内容</div>
                
                <div th:if="${reply.parent != null}" style="margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 6px; border-left: 3px solid #2e7d32;">
                    <div style="font-size: 12px; color: #6c757d; margin-bottom: 5px;">元の投稿:</div>
                    <div style="font-size: 13px; color: #495057;" th:utext="${reply.parent.content}">元の投稿内容</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function showTab(tabName) {
    console.log('showTab called:', tabName);
    
    const postsTab = document.getElementById('posts-tab');
    const repliesTab = document.getElementById('replies-tab');
    const postsStat = document.getElementById('posts-stat');
    const repliesStat = document.getElementById('replies-stat');
    
    // 全てのタブを非表示
    postsTab.classList.remove('active');
    repliesTab.classList.remove('active');
    postsStat.classList.remove('active');
    repliesStat.classList.remove('active');
    
    // 選択されたタブを表示
    if (tabName === 'posts') {
        postsTab.classList.add('active');
        postsStat.classList.add('active');
        console.log('Posts tab activated');
    } else if (tabName === 'replies') {
        repliesTab.classList.add('active');
        repliesStat.classList.add('active');
        console.log('Replies tab activated');
    }
}

// ページ読み込み時に投稿タブをアクティブに（既にHTMLで設定済み）
console.log('Page loaded');
</script>

</body>
</html>
