<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロフィール編集 - kawa-web</title>
<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f5f5f5;
    min-height: 100vh;
}

.container {
    max-width: 600px;
    margin: 0 auto;
    padding: 30px;
    background: white;
    min-height: calc(100vh - 60px);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding: 20px 0;
    border-bottom: 2px solid #e1e5e9;
}

.header h1 {
    font-size: 28px;
    font-weight: 700;
    color: #2e7d32;
    letter-spacing: -0.5px;
}

.btn-back {
    background: rgba(46, 125, 50, 0.1);
    color: #2e7d32;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 14px;
    text-decoration: none;
    transition: all 0.3s ease;
}

.btn-back:hover {
    background: rgba(46, 125, 50, 0.15);
    transform: translateY(-1px);
}

.alert {
    padding: 16px 20px;
    margin-bottom: 25px;
    border-radius: 6px;
    font-weight: 500;
}

.alert-error {
    background: rgba(220, 53, 69, 0.1);
    color: #721c24;
    border-left: 4px solid #dc3545;
}

.alert-success {
    background: rgba(40, 167, 69, 0.1);
    color: #155724;
    border-left: 4px solid #28a745;
}

.alert-info {
    background: rgba(13, 202, 240, 0.1);
    color: #055160;
    border-left: 4px solid #0dcaf0;
}

.section {
    background: rgba(46, 125, 50, 0.05);
    padding: 25px;
    border-radius: 8px;
    margin-bottom: 25px;
    border: 1px solid rgba(46, 125, 50, 0.15);
}

.section h3 {
    margin-top: 0;
    color: #495057;
    font-weight: 600;
    font-size: 18px;
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #495057;
    font-size: 14px;
}

input[type="text"],
input[type="password"],
input[type="file"],
textarea {
    width: 100%;
    padding: 12px;
    border: 2px solid #e1e5e9;
    border-radius: 6px;
    font-size: 14px;
    box-sizing: border-box;
    font-family: inherit;
    transition: all 0.3s ease;
}

textarea {
    resize: vertical;
    min-height: 120px;
}

input[type="text"]:focus,
input[type="password"]:focus,
textarea:focus {
    outline: none;
    border-color: #2e7d32;
    box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
}

input.error,
textarea.error {
    border-color: #dc3545;
}

input.success,
textarea.success {
    border-color: #28a745;
}

.form-note {
    font-size: 12px;
    color: #6c757d;
    margin-top: 4px;
}

.form-note.error {
    color: #dc3545;
}

.form-note.success {
    color: #28a745;
}

.char-counter {
    text-align: right;
    font-size: 12px;
    color: #6c757d;
    margin-top: 4px;
}

.char-counter.warning {
    color: #ff9800;
}

.char-counter.error {
    color: #dc3545;
}

.current-icon {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: #2e7d32;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    font-weight: 700;
    color: white;
    margin-bottom: 15px;
    overflow: hidden;
}

.current-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.btn {
    padding: 12px 24px;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
}

.btn-primary {
    background: #2e7d32;
    color: white;
    width: 100%;
}

.btn-primary:hover {
    background: #1b5e20;
    transform: translateY(-1px);
}

.btn-danger {
    background: rgba(220, 53, 69, 0.1);
    color: #dc3545;
}

.btn-danger:hover {
    background: #dc3545;
    color: white;
    transform: translateY(-1px);
}

.icon-actions {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.required {
    color: #dc3545;
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>プロフィール編集</h1>
        <a href="/mypage" class="btn-back">← マイページ</a>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${info}" class="alert alert-info" th:text="${info}"></div>
	
	<!-- アイコン変更 -->
	<div class="section">
	    <h3>プロフィールアイコン</h3>
	    
	    <div class="current-icon">
	        <img th:if="${user.iconPath != null}" 
	             th:src="@{'/uploads/icons/' + ${user.iconPath}}" 
	             alt="現在のアイコン">
	        <span th:if="${user.iconPath == null}" 
	              th:text="${#strings.substring(user.username, 0, 1).toUpperCase()}">U</span>
	    </div>

	    <form action="/mypage/update-icon" method="post" enctype="multipart/form-data">
	        <div class="form-group">
	            <label for="iconFile">新しいアイコン画像</label>
	            <input type="file" id="iconFile" name="iconFile" accept="image/*">
	            <div class="form-note">画像ファイル（JPG, PNG, GIF）を選択してください</div>
	        </div>
	        
	        <div class="icon-actions">
	            <button type="submit" class="btn btn-primary" style="flex: 1;">アイコンを変更</button>
	            <button type="button" class="btn btn-danger" 
	                    th:if="${user.iconPath != null}"
	                    onclick="if(confirm('アイコンを削除しますか？')) { document.getElementById('deleteIconForm').submit(); }">
	                削除
	            </button>
	        </div>
	    </form>

	    <form id="deleteIconForm" action="/mypage/delete-icon" method="post" style="display: none;"></form>
	</div>


    <!-- 基本情報変更 -->
    <div class="section">
        <h3>基本情報</h3>
        <form action="/mypage/update-profile" method="post">
            <div class="form-group">
                <label for="username">ユーザー名 <span class="required">*</span></label>
                <input type="text" id="username" name="username" 
                       th:value="${user.username}" 
                       required
                       minlength="3"
                       placeholder="新しいユーザー名">
                <div class="form-note">3文字以上で入力してください</div>
            </div>

            <div class="form-group">
                <label for="userId">ユーザーID <span class="required">*</span></label>
                <input type="text" id="userId" name="userId" 
                       th:value="${user.userId}" 
                       required
                       pattern="[a-zA-Z0-9_.]+"
                       minlength="6"
                       maxlength="20"
                       placeholder="新しいユーザーID">
                <div class="form-note" id="userIdNote">
                    6～20文字。アルファベット、数字、_、.のみ使用可能
                </div>
            </div>

            <div class="form-group">
                <label for="bio">自己紹介</label>
                <textarea id="bio" name="bio" 
                          maxlength="500"
                          placeholder="自己紹介を入力してください（500文字以内）"
                          th:text="${user.bio}"></textarea>
                <div class="char-counter" id="bioCounter">
                    <span id="bioCount">0</span> / 500文字
                </div>
            </div>

            <button type="submit" class="btn btn-primary">基本情報を更新</button>
        </form>
    </div>


    <!-- パスワード変更 -->
    <div class="section">
        <h3>パスワード変更</h3>
        <form action="/mypage/update-password" method="post">
            <div class="form-group">
                <label for="currentPassword">現在のパスワード <span class="required">*</span></label>
                <input type="password" id="currentPassword" name="currentPassword" required>
            </div>

            <div class="form-group">
                <label for="newPassword">新しいパスワード <span class="required">*</span></label>
                <input type="password" id="newPassword" name="newPassword" required minlength="8">
                <div class="form-note">8文字以上で入力してください</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">新しいパスワード（確認） <span class="required">*</span></label>
                <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8">
            </div>

            <button type="submit" class="btn btn-primary">パスワードを変更</button>
        </form>
    </div>
</div>

<script>
// 自己紹介文字数カウンター
const bioTextarea = document.getElementById('bio');
const bioCount = document.getElementById('bioCount');
const bioCounter = document.getElementById('bioCounter');

function updateBioCounter() {
    const length = bioTextarea.value.length;
    bioCount.textContent = length;
    
    bioCounter.classList.remove('warning', 'error');
    
    if (length > 500) {
        bioCounter.classList.add('error');
    } else if (length > 450) {
        bioCounter.classList.add('warning');
    }
}

bioTextarea.addEventListener('input', updateBioCounter);
// 初期表示時にもカウント
updateBioCounter();

// ユーザーIDのリアルタイムバリデーション
const userIdInput = document.getElementById('userId');
const userIdNote = document.getElementById('userIdNote');

userIdInput.addEventListener('input', function() {
    const value = this.value;
    const pattern = /^[a-zA-Z0-9_.]+$/;
    
    if (value === '') {
        this.classList.remove('error', 'success');
        userIdNote.classList.remove('error', 'success');
        userIdNote.textContent = '6～20文字。アルファベット、数字、_、.のみ使用可能';
        return;
    }
    
    if (!pattern.test(value)) {
        this.classList.add('error');
        this.classList.remove('success');
        userIdNote.classList.add('error');
        userIdNote.classList.remove('success');
        userIdNote.textContent = '使用できない文字が含まれています';
        return;
    }
    
    if (value.length < 6) {
        this.classList.add('error');
        this.classList.remove('success');
        userIdNote.classList.add('error');
        userIdNote.classList.remove('success');
        userIdNote.textContent = 'あと' + (6 - value.length) + '文字必要です';
        return;
    }
    
    if (value.length > 20) {
        this.classList.add('error');
        this.classList.remove('success');
        userIdNote.classList.add('error');
        userIdNote.classList.remove('success');
        userIdNote.textContent = '20文字以内で入力してください';
        return;
    }
    
    this.classList.remove('error');
    this.classList.add('success');
    userIdNote.classList.remove('error');
    userIdNote.classList.add('success');
    userIdNote.textContent = '✓ 使用可能な形式です';
});

// パスワード確認のバリデーション
document.querySelectorAll('form').forEach(form => {
    form.addEventListener('submit', function(e) {
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        
        if (newPassword && confirmPassword) {
            if (newPassword.value !== confirmPassword.value) {
                e.preventDefault();
                alert('新しいパスワードと確認用パスワードが一致しません');
                return false;
            }
        }
    });
});
</script>
</body>
</html>
